name: Release

# Releases are cut deliberately: run this workflow from the Actions tab once
# the "Unreleased" section of CHANGELOG.md describes what is shipping. Every
# release reaches users as an in-app update prompt, so merging to main must
# not publish one by itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1.0. Leave empty to bump the patch number of the latest tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          # Get the latest version tag, sorted by semver
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n1)
          if [ -n "$REQUESTED" ]; then
            # Minor and major releases are chosen by a person, not inferred.
            if ! [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must look like 1.2.3, got '$REQUESTED'"
              exit 1
            fi
            NEW_VERSION="$REQUESTED"
          elif [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="1.0.0"
          else
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "::notice::Building and releasing v$NEW_VERSION (previous: ${LATEST_TAG:-none})"

      - name: Update version in config files
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Keep Tauri v2 config, Rust package metadata, and npm metadata aligned.
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          # Update Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          # The release commit may already carry this version.
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Updated version to $VERSION"

      # Build the release body from the top CHANGELOG section so the updater's
      # in-app "What's new" popup shows the actual changes. The dialog strips the
      # Installation/Requirements block below; the GitHub release page keeps it.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Lines of the first "## [...]" section, excluding the two heading
          # lines that bound it.
          CHANGES=$(awk '/^## \[/{c++; next} c==1' CHANGELOG.md)
          if [ -z "$(echo "$CHANGES" | tr -d '[:space:]')" ]; then
            CHANGES="A new version of PortKiller is available."
          fi
          {
            echo "notes<<__PK_NOTES__"
            echo "## What's new in v$VERSION"
            echo ""
            printf '%s\n' "$CHANGES"
            echo ""
            echo "### Installation"
            echo "- **\`.exe\`** — NSIS installer (recommended)"
            echo "- **\`.msi\`** — Standard Windows installer"
            echo ""
            echo "### Requirements"
            echo "- Windows 10/11 (x64)"
            echo "- WebView2 Runtime (auto-installed)"
            echo ""
            echo "See the [CHANGELOG](https://github.com/Razee4315/portkiller/blob/main/CHANGELOG.md) for the full history."
            echo "__PK_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing — the matching pubkey lives in
          # tauri.conf.json. With createUpdaterArtifacts enabled the build FAILS
          # if this secret is missing, so it must stay set on the repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The signing key was generated without a password; GitHub refuses
          # empty-valued secrets, so the empty password is set inline here.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: npx tauri
          tagName: v__VERSION__
          releaseName: 'PortKiller v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          # Emit latest.json (the updater manifest) alongside the installers.
          includeUpdaterJson: true
